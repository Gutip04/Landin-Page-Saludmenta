<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hospital José Cayetano Vasquez | Iniciar Sesión</title>
  <link href="./src/output.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>

<body class="bg-gradient-to-r from-teal-400 via-emerald-500 to-green-600 min-h-screen flex items-center justify-center p-4">

  <!--  Tarjeta del Login -->
  <div class="bg-white/90 backdrop-blur-md rounded-2xl shadow-2xl p-8 w-full max-w-md animate-fadeIn">
    <!-- Logo o título -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-emerald-600">Hospital José Cayetano Vasquez 🧘‍♂️</h1>
      <p class="text-gray-500 mt-2">Inicia sesión y cuida tu bienestar emocional</p>
    </div>

    <!-- Formulario -->
    <form action="#" method="POST" class="space-y-6">
      <!-- Usuario -->
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
        <input type="text" id="username" name="username" placeholder="Tu nombre de usuario" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
      </div>

      <!-- Contraseña -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
      </div>

      <!-- Recordarme y Olvidar contraseña -->
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center">
          <input type="checkbox" class="text-emerald-600 focus:ring-0 rounded">
          <span class="ml-2 text-gray-600">Recordarme</span>
        </label>
        <a href="#" class="text-emerald-600 hover:text-emerald-700 font-medium">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Botón -->
      <button type="submit"
              class="w-full bg-emerald-600 text-white font-semibold py-2 rounded-lg hover:bg-emerald-700 transition transform hover:-translate-y-0.5">
        Iniciar Sesión
      </button>
    </form>

    <!-- Divider -->
    <div class="flex items-center my-6">
      <div class="flex-1 h-px bg-gray-300"></div>
      <span class="px-3 text-sm text-gray-500">o continúa con</span>
      <div class="flex-1 h-px bg-gray-300"></div>
    </div>

    <!-- Botones sociales -->
    <div class="flex justify-center space-x-4">
      <button class="p-2 border border-gray-300 rounded-lg hover:bg-gray-100 transition">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
      </button>
      <button class="p-2 border border-gray-300 rounded-lg hover:bg-gray-100 transition">
        <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" alt="Facebook" class="w-5 h-5">
      </button>

    </div>

  <!-- Animación CSS -->
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.8s ease-out forwards;
    }
  </style>
</body>
</html>
